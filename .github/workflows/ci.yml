name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run fonts:fetch

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run check:tarball

      - run: npm run check:install

      - run: npm run check:package

      - name: Build examples
        run: |
          npx vite build --config examples/quickstart/vite.config.ts
          npx vite build --config examples/worker/vite.config.ts
          npx vite build --config examples/designer/vite.config.ts
